name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.1

            - name: Setup Node.js
              uses: actions/setup-node@v6.1.0
              with:
                  node-version: 24
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Create release pull request or publish
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: npm run version
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # changeset v3's `publish` no longer prints the "New tag:" lines changesets/action matches on, so the
            # action never pushes the tags `changeset publish` creates. Push them here: the Wiki workflow only
            # syncs when a release tag points at the Release run's head commit.
            - name: Push release tags
              run: git push origin --tags
