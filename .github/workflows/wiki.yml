name: Wiki

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'scripts/wiki-sync.mjs'
            - '.github/workflows/wiki.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: wiki
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    sync:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.1

            - name: Setup Node.js
              uses: actions/setup-node@v6.1.0
              with:
                  node-version: 24

            - name: Clone wiki
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
                  echo "::add-mask::$auth"
                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
                  export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
                  if ! git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
                      echo "::error::Could not clone the wiki of ${GITHUB_REPOSITORY}. Enable Wikis in the repository settings (Features > Wikis) and create a first page in the GitHub UI, since the wiki repository does not exist until then."
                      exit 1
                  fi

            - name: Build wiki from docs
              run: node scripts/wiki-sync.mjs "$RUNNER_TEMP/wiki"

            - name: Push changes
              working-directory: ${{ runner.temp }}/wiki
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo 'Wiki is already up to date'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git commit -m "docs: sync from ${GITHUB_SHA::7}"
                  auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
                  echo "::add-mask::$auth"
                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
                  export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
                  git push origin HEAD
