name: Wiki

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'scripts/wiki-sync.mjs'
            - '.github/workflows/wiki.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: wiki
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6.0.1

            - name: Setup Node.js
              uses: actions/setup-node@v6.1.0
              with:
                  node-version: 24

            - name: Clone wiki
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

            - name: Build wiki from docs
              run: node scripts/wiki-sync.mjs "$RUNNER_TEMP/wiki"

            - name: Push changes
              working-directory: ${{ runner.temp }}/wiki
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo 'Wiki is already up to date'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git commit -m "docs: sync from ${GITHUB_SHA::7}"
                  git push
